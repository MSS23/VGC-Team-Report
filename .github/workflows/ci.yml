name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # VGC-261: `npm run typecheck` == `tsc --noEmit --incremental false`.
      # Same command locally and in CI so a warm .tsbuildinfo can never make the
      # two disagree (a stale one has masked real errors before).
      - run: npm run typecheck
      # ponytail: 35 pre-existing lint errors (react-hooks etc.) — non-blocking
      # until that debt is cleared, then remove continue-on-error
      - run: npm run lint
        continue-on-error: true
      - run: npm test
